<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life Residence · Ambientes em 3D</title>
<link rel="stylesheet" href="css/game.css?v=3">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<canvas id="cv" aria-label="Ambiente em 3D"></canvas>

<!-- Mapa do lazer: escolha o ambiente -->
<section id="hub">
  <header class="bar">
    <div class="brand"><i></i><b>Life Residence</b><span>Ambientes em 3D</span></div>
    <div class="areas" role="tablist">
      <button type="button" role="tab" data-a="01" class="on">Lazer 01</button>
      <button type="button" role="tab" data-a="02">Lazer 02</button>
    </div>
    <a class="back" href="index.html">← Maquete</a>
  </header>
  <div class="stage">
    <div id="board"><img id="hubImg" alt="" draggable="false"><div id="hubPins"></div></div>
  </div>
  <p class="hubhint">Clique num ponto para entrar no ambiente em 3D</p>
</section>

<!-- Dentro do ambiente -->
<div id="hud" hidden>
  <button type="button" id="exit" class="hb">← Mapa</button>
  <b id="roomName"></b>
  <span class="sp"></span>
  <button type="button" id="vPhoto" class="hb">Vista da foto</button>
  <button type="button" id="vCam" class="hb">1ª pessoa</button>
  <button type="button" id="vOrig" class="hb">Foto original</button>
</div>
<div id="help" hidden><span class="k-mouse"><b>W A S D</b> andar · <b>Shift</b> correr · <b>arraste</b> para olhar · <b>V</b> 1ª/3ª pessoa · <b>Esc</b> mapa</span><span class="k-touch">Joystick para andar · arraste a tela para olhar</span></div>
<div id="stick" aria-hidden="true"><i></i></div>

<div id="photo" hidden role="dialog" aria-modal="true" aria-label="Foto do ambiente">
  <button type="button" class="px" id="pClose" aria-label="Fechar">×</button>
  <figure>
    <img id="pImg" alt="">
    <figcaption><b id="pCap"></b><span id="pNote"></span></figcaption>
  </figure>
</div>
<div id="err" hidden>Não foi possível iniciar o 3D neste aparelho.</div>

<script type="module" src="js/game.js?v=5"></script>
</body>
</html>
